[package]
name = "splithello"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hickory-proto = "0.26.3"
idna = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
